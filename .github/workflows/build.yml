name: 构建 APK

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: debug + release
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 装 JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: 装 Android SDK（platform 36 / build-tools 36.0.0）
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v6

      # 没配签名密钥也能跑通：keystore.properties 不存在时 release 自动退回 debug 签名
      # （见 app/build.gradle.kts 的 signingConfigs 分支），只是那种包不可发布。
      - name: 写入正式签名
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::notice title=未配置签名密钥::release 包退回 debug 签名，只能本机测试、不可发布"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > keystore.properties

      - name: 构建 debug 与 release
        run: ./gradlew assembleDebug assembleRelease

      - name: 整理产物
        id: dist
        run: |
          BUILD_ID=$(sed -n 's/.*BUILD_ID[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' \
            app/src/main/java/com/lookie/opluswubi/WubiModule.kt | head -1)
          BUILD_ID=${BUILD_ID:-unknown}
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk     "dist/oplus-wubi-${BUILD_ID}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/oplus-wubi-${BUILD_ID}-release.apk"
          echo "build_id=${BUILD_ID}" >> "$GITHUB_OUTPUT"
          ls -l dist

      - name: 上传 debug 产物
        uses: actions/upload-artifact@v7
        with:
          name: oplus-wubi-debug-${{ steps.dist.outputs.build_id }}
          path: dist/*-debug.apk
          if-no-files-found: error

      - name: 上传 release 产物
        uses: actions/upload-artifact@v7
        with:
          name: oplus-wubi-release-${{ steps.dist.outputs.build_id }}
          path: dist/*-release.apk
          if-no-files-found: error
